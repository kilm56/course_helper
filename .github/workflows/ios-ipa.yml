name: Build unsigned iOS IPA

# 用途：在本仓库的 macOS runner 上编译 course_helper 的 iOS 版，
# 产出未签名 .ipa（Payload/Runner.app），供 Sideloadly / AltStore 在 Windows 上签名安装。
#
# 上游 ios/ 目录是没维护过的老模板，本工作流会先修三处硬伤再编译：
#   1) Podfile 调用了不存在的 parse_KV_file -> 整体重写成标准模板
#   2) Flutter/Debug.xcconfig、Release.xcconfig 没引入 Pods xcconfig -> 补上
#   3) Info.plist 缺少相机/相册/定位/麦克风权限描述 -> 补上（否则装上后一用就闪退）

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ios-ipa.yml"

env:
  # 需要兼容更低系统就把这里改成 13.0
  IOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  build-ipa:
    name: flutter build ios (no codesign)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库 pubspec 要求 flutter ^3.41.8 / dart ^3.11.5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version || true

      - name: flutter pub get
        run: flutter pub get

      # 修复 1：上游 Podfile 的 flutter_root 调用了未定义的 parse_KV_file
      # （大写 KV），任何 pod install 都会直接报错。
      - name: Repair stale Podfile
        working-directory: ios
        run: |
          cat > Podfile <<'PODFILE'
          # Rewritten by CI: upstream Podfile called an undefined parse_KV_file helper.
          platform :ios, ENV['IOS_DEPLOYMENT_TARGET'] || '15.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)

              # permission_handler 在 iOS 上用宏控制权限是否参与编译，默认全部排除。
              # 不在这里声明，Permission.location.request() 不会弹系统权限框、
              # 也不会在“设置-隐私-定位服务”里出现条目，百度定位永远拿不到坐标。
              target.build_configurations.each do |config|
                config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] ||= [
                  '$(inherited)',
                  'PERMISSION_LOCATION=1',
                  'PERMISSION_LOCATION_WHENINUSE=0',
                  'PERMISSION_CAMERA=1',
                  'PERMISSION_PHOTOS=1',
                  'PERMISSION_MICROPHONE=1',
                  'PERMISSION_NOTIFICATIONS=1',
                ]
              end
            end
          end
          PODFILE
          echo "--- 语法检查 ---"
          ruby -c Podfile
          echo "--- 生成结果 ---"
          cat Podfile

      # 修复 2：上游 Debug/Release.xcconfig 只有 #include "Generated.xcconfig"，
      # 没有引入 Pods 的 xcconfig，链接阶段会找不到插件框架。
      - name: Patch Flutter xcconfigs
        working-directory: ios/Flutter
        run: |
          set -euo pipefail
          add_include () {
            file="$1"
            cfg="$2"
            needle="Pods-Runner.${cfg}.xcconfig"
            if grep -qF "$needle" "$file"; then
              echo "已包含 $needle ($file)"
            else
              printf '#include? "Pods/Target Support Files/Pods-Runner/%s"\n' "$needle" | cat - "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
              echo "已补上 $needle ($file)"
            fi
          }
          add_include Debug.xcconfig debug
          add_include Release.xcconfig release
          echo "--- Debug.xcconfig ---"; cat Debug.xcconfig
          echo "--- Release.xcconfig ---"; cat Release.xcconfig

      # 修复 3：补权限描述，避免运行到相机/相册/定位时直接崩溃
      - name: Patch Info.plist permissions
        run: |
          set -euo pipefail
          PLIST="ios/Runner/Info.plist"
          if [ ! -x /usr/libexec/PlistBuddy ]; then
            echo "PlistBuddy 不可用，跳过"; exit 0
          fi
          set_plist () {
            key="$1"; val="$2"
            /usr/libexec/PlistBuddy -c "Set :$key $val" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$key string $val" "$PLIST"
          }
          set_plist NSCameraUsageDescription "扫码与拍照签到需要相机权限"
          set_plist NSPhotoLibraryUsageDescription "上传图片与课件需要相册权限"
          set_plist NSPhotoLibraryAddUsageDescription "保存课件图片需要相册写入权限"
          set_plist NSMicrophoneUsageDescription "在线课堂语音互动需要麦克风权限"
          set_plist NSLocationWhenInUseUsageDescription "位置签到需要定位权限"
          echo "--- 权限相关键 ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "UsageDescription" || true

      # 百度 AK 是按 Bundle ID 绑定的，必须与百度控制台申请时填写的完全一致，
      # 否则 iOS SDK 鉴权会失败（地图空白/定位无回调）。
      - name: Set bundle identifier
        env:
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.kilm.coursehelper' }}
        run: |
          set -euo pipefail
          OLD="com.example.chaoxingSignin"
          sed -i '' "s/${OLD}/${BUNDLE_ID}/g" ios/Runner.xcodeproj/project.pbxproj
          echo "目标 Bundle ID: ${BUNDLE_ID}"
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj | sort -u
          if ! grep -qE "PRODUCT_BUNDLE_IDENTIFIER = \"?${BUNDLE_ID}" ios/Runner.xcodeproj/project.pbxproj; then
            echo "::error::Bundle ID 替换失败，上游工程里的值可能已变化"
            exit 1
          fi

      # 上游 Dart 代码从未调用百度 SDK 的鉴权方法：
      #   地图走 flutter_bmfbase/sdk/setApiKey，定位走 flutter_bmflocation/setAK
      # Android 靠 Manifest 的 com.baidu.lbsapi.API_KEY 自动鉴权，iOS 没有该机制，
      # 所以必须在应用启动时显式调用。仅在 iOS 分支生效，不影响 Android 行为。
      - name: Patch Dart for iOS Baidu auth
        env:
          BAIDU_IOS_AK: ${{ secrets.BAIDU_IOS_AK }}
        run: |
          cat > /tmp/patch_baidu.py <<'PYFILE'
          import os, pathlib, sys

          ak = os.environ.get("BAIDU_IOS_AK", "").strip()
          if not ak:
              print("::error::缺少仓库 Secret: BAIDU_IOS_AK")
              sys.exit(1)

          p = pathlib.Path("lib/main.dart")
          src = p.read_text(encoding="utf-8")

          if "BAIDU_IOS_AK_INIT" in src:
              print("main.dart 已打过补丁，跳过")
              sys.exit(0)

          src = src.replace(
              "import 'package:flutter/material.dart';",
              "import 'dart:io' show Platform;\nimport 'package:flutter/material.dart';",
              1,
          )

          anchor = "import 'push/update.dart';"
          extra = (
              "\nimport 'package:flutter_baidu_mapapi_base/flutter_baidu_mapapi_base.dart';"
              "\nimport 'package:flutter_bmflocation/flutter_bmflocation.dart';"
          )
          src = src.replace(anchor, anchor + extra, 1)

          marker = "  WidgetsFlutterBinding.ensureInitialized();"
          if marker not in src:
              print("::error::main.dart 中找不到 ensureInitialized 锚点")
              sys.exit(1)

          lines = [
              "",
              "  // BAIDU_IOS_AK_INIT: iOS 必须显式鉴权，Android 由 Manifest meta-data 自动完成",
              "  if (Platform.isIOS) {",
              "    BMFMapSDK.setAgreePrivacy(true);",
              "    BMFMapSDK.setApiKeyAndCoordType('__AK__', BMF_COORD_TYPE.BD09LL);",
              "    // 定位 SDK 是独立鉴权：隐私协议 + AK 都要单独过一遍",
              "    final bmfLocation = LocationFlutterPlugin();",
              "    await bmfLocation.setAgreePrivacy(true);",
              "    await bmfLocation.authAK('__AK__');",
              "    await LocationFlutterPlugin.setApiKey('__AK__');",
              "  }",
          ]
          block = marker + "\n" + "\n".join(lines).replace("__AK__", ak)
          src = src.replace(marker, block, 1)
          p.write_text(src, encoding="utf-8")
          print("已注入百度 iOS 鉴权，AK 前缀: %s****" % ak[:4])

          # --- 2) baidu_map.dart：修正 iOS 定位判定逻辑 ---
          # 官方文档：locType「仅Android端返回」，iOS 上恒为 null。
          # 上游用 locType>0 判定成功，导致 iOS 永远走失败分支。
          q = pathlib.Path("lib/pages/widget/baidu_map.dart")
          src2 = q.read_text(encoding="utf-8")

          old_cond = "if (result.locType != null && result.locType! > 0) {"
          new_cond = (
              "if (result.latitude != null &&\n"
              "          result.longitude != null &&\n"
              "          (result.locType == null || result.locType! > 0) &&\n"
              "          (result.errorCode == null || result.errorCode == 0)) {"
          )
          if old_cond in src2:
              src2 = src2.replace(old_cond, new_cond, 1)
              print("baidu_map.dart: 成功判定已改为经纬度 + errorCode")
          else:
              print("::warning::baidu_map.dart 未找到 locType 判定语句")

          for old_msg in [
              "_locationInfo = '定位失败，请重试';",
              "_locationInfo = '定位失败(错误码 ${result.locType})，请重试';",
          ]:
              if old_msg in src2:
                  src2 = src2.replace(
                      old_msg,
                      "_locationInfo = '定位失败(code=${result.errorCode}, info=${result.errorInfo})，请重试';",
                      1,
                  )
                  print("baidu_map.dart: 失败提示已改为 errorCode / errorInfo")
                  break

          q.write_text(src2, encoding="utf-8")
          PYFILE
          python3 /tmp/patch_baidu.py
          echo "--- main.dart 前 45 行 ---"
          sed -n '1,45p' lib/main.dart
          echo "--- 定位错误码补丁 ---"
          grep -n "错误码" lib/pages/widget/baidu_map.dart || true

      # 补丁如果写坏了 Dart，这里 30 秒内就能报出来，不用等整包编译
      - name: Analyze patched Dart
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/main.dart lib/pages/widget/baidu_map.dart

      - name: Normalize Xcode deployment target
        working-directory: ios
        run: |
          set -euo pipefail
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = ${IOS_DEPLOYMENT_TARGET};/g" Runner.xcodeproj/project.pbxproj
          echo "命中行数: $(grep -c "IPHONEOS_DEPLOYMENT_TARGET = ${IOS_DEPLOYMENT_TARGET}" Runner.xcodeproj/project.pbxproj || true)"

      # 生成 ios/Flutter/Generated.xcconfig（Podfile 的 flutter_root 依赖它）
      - name: Generate Xcode config
        run: |
          set -o pipefail
          flutter build ios --config-only --release --no-codesign 2>&1 | tee ios/xcode_config.log

      - name: pod install
        working-directory: ios
        run: |
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            if pod install 2>&1 | tee pod_install.log; then
              ok=1
              break
            fi
            echo "::warning::pod install 第 ${i} 次失败，清理缓存后重试"
            rm -rf "$HOME/Library/Caches/CocoaPods"
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::pod install 连续 3 次失败，请查看 ios-build-failure-info 里的 pod_install.log"
            exit 1
          fi
          test -f Podfile.lock || { echo "::error::未生成 Podfile.lock"; exit 1; }
          echo "--- 权限宏是否真的写进 Pods ---"
          grep -rl "PERMISSION_LOCATION=1" Pods 2>/dev/null | head -5 || echo "::warning::Pods 中未找到权限宏"

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到 $APP，请检查上面的构建日志"
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CourseHelper-unsigned.ipa Payload
          ls -lh CourseHelper-unsigned.ipa

          echo "--- 关键校验 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          test -f "Payload/Runner.app/Frameworks/App.framework/App" && echo "OK: AOT snapshot 存在"
          unzip -l CourseHelper-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CourseHelper-unsigned-ipa
          path: CourseHelper-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure info
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-failure-info
          path: |
            ios/Podfile
            ios/Podfile.lock
            ios/Flutter/Debug.xcconfig
            ios/Flutter/Release.xcconfig
            ios/pod_install.log
            ios/xcode_config.log
          if-no-files-found: ignore
          retention-days: 7
